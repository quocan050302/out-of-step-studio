name: Studio React Vite validation
on:
  push:
    branches: [main, feat/studio-react-vite-migration]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/studio-react-vite.yml"
jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: SCREENSHOT_DIR=/tmp/oos-e2e-shots npm run test:e2e
